# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: autoload_access_from_logic
    status: active
    description: "Logic classes must not reference any Autoload (incl. TimeProvider) or get_tree(). Only src/core/app/ (GameRoot) and src/core/time/ may name TimeProvider."
    why: "Keeps every logic class constructible in a unit test with FakeTimeSource and no scene tree."
    adr: docs/architecture/adr-0001-time-and-event-injection.md
    added: 2026-09-23

  - pattern: global_event_bus
    status: active
    description: "No Events/EventBus Autoload for gameplay signals in MVP. Emitters declare their own typed signals."
    why: "Hides dependencies and shares global state across tests; the MVP system graph is small and known."
    adr: docs/architecture/adr-0001-time-and-event-injection.md
    added: 2026-09-23

  - pattern: engine_timer_in_logic
    status: active
    description: "No engine Timer, _process tick, or per-frame decay inside logic classes. Timers live only in adapter Nodes (e.g. NeedCrossingScheduler) that hold no rules."
    why: "Need values are computed on read from anchors; a tick would duplicate the decay path and break determinism."
    adr: docs/architecture/adr-0001-time-and-event-injection.md
    added: 2026-09-23

  - pattern: definition_duplicate
    status: active
    description: "No duplicate()/duplicate_deep() on any DefinitionResource type outside tests/."
    why: "_locked is not a stored property, so a duplicate is an unlocked, writable copy that escapes Core Rule 3."
    adr: docs/architecture/adr-0002-pet-catalog-loading-and-immutability.md
    added: 2026-09-23

  - pattern: sprite_frames_mutation
    status: active
    description: "No SpriteFrames mutators under src/ (add/remove/set_frame, clear, clear_all, add/remove/rename/duplicate_animation, set_animation_speed/loop/loop_mode)."
    why: "SpriteFrames is an engine class that setter guards cannot protect, and it is shared by reference from the catalog."
    adr: docs/architecture/adr-0002-pet-catalog-loading-and-immutability.md
    added: 2026-09-23

  - pattern: pet_data_load_outside_loader
    status: active
    description: "Only PetCatalogLoader may load() or ResourceLoader.load() anything under res://assets/data/pets/."
    why: "A CACHE_MODE_IGNORE load returns an unlocked instance that bypasses the catalog lock."
    adr: docs/architecture/adr-0002-pet-catalog-loading-and-immutability.md
    added: 2026-09-23

  - pattern: dictionary_in_definition_schema
    status: active
    description: "No Dictionary-typed fields in DefinitionResource subclasses; use named fields or typed arrays."
    why: "make_read_only() is shallow and dictionaries cannot be setter-guarded per key."
    adr: docs/architecture/adr-0002-pet-catalog-loading-and-immutability.md
    added: 2026-09-23

