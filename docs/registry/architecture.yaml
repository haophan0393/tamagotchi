# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:


  - purpose: pet_definition_storage
    status: active
    api: "Custom Resource .tres (DefinitionResource subclasses), reached via CatalogManifest @export Array[SpeciesDefinition] ext_resource references"
    not: "JSON definition files; resource path strings in data"
    adr: docs/architecture/adr-0002-pet-catalog-loading-and-immutability.md
    reason: "Inspector authoring plus export dependency tracking; path strings risk silent PCK omission"
    referenced_by:
      - docs/architecture/adr-0002-pet-catalog-loading-and-immutability.md
    added: 2026-09-23
    revised: ""

