# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-09-23"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: engine_wall_clock
    status: active
    owner_system: time-service
    adr: docs/architecture/adr-0001-time-and-event-injection.md
    interface: "Read only via SystemTimeSource (src/core/time/system_time_source.gd) behind TimeSource; everything else uses an injected TimeService"
    write_access: none (read-only OS clock)
    referenced_by:
      - docs/architecture/adr-0001-time-and-event-injection.md
    added: 2026-09-23
    revised: ""

  - state: production_time_service_instance
    status: active
    owner_system: time-service
    adr: docs/architecture/adr-0001-time-and-event-injection.md
    interface: "TimeProvider.service (Autoload, read-only TimeService). Read by GameRoot only; logic receives it through _init()"
    write_access: TimeProvider-only
    referenced_by:
      - docs/architecture/adr-0001-time-and-event-injection.md
    added: 2026-09-23
    revised: ""


  - state: pet_definitions
    status: active
    owner_system: pet-definition-data
    adr: docs/architecture/adr-0002-pet-catalog-loading-and-immutability.md
    interface: "PetCatalog lookups (injected). Definitions are locked DefinitionResource graphs: read-only after READY; writes are rejected by setter guards"
    write_access: PetCatalogLoader only, before lock()
    referenced_by:
      - docs/architecture/adr-0002-pet-catalog-loading-and-immutability.md
    added: 2026-09-23
    revised: ""

# Example:
#
# state_ownership:
#   - state: player_health
#     status: active           # active | superseded_by: ADR-NNNN
#     owner_system: health-system
#     adr: docs/architecture/adr-0001-health-system.md
#     interface: "HealthComponent.current_health (read-only float, range 0–max_health)"
#     write_access: health-system-only   # only owner can write; others read
#     referenced_by:
#       - docs/architecture/adr-0001-health-system.md
#       - docs/architecture/adr-0003-combat-system.md   # reads to apply damage
#       - docs/architecture/adr-0007-ui-system.md       # reads to display HUD
#     added: 2026-03-26
#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: time_source
    status: active
    pattern: direct_call
    producer: time-service
    consumers:
      - time-service   # TimeService wraps it; no other system touches TimeSource
    adr: docs/architecture/adr-0001-time-and-event-injection.md
    signature: "@abstract TimeSource extends RefCounted: get_unix_time() -> int; get_timezone_bias_minutes() -> int  # minutes EAST of UTC"
    referenced_by:
      - docs/architecture/adr-0001-time-and-event-injection.md
      - tests/unit/time_service/time_service_contract_test.gd
    added: 2026-09-23
    revised: ""

  - contract: logic_event_delivery
    status: active
    pattern: signal
    producer: any logic class (RefCounted)
    consumers:
      - any system, connected by GameRoot
    adr: docs/architecture/adr-0001-time-and-event-injection.md
    signal_signature: "Typed signals declared on the emitting class (e.g. NeedSystem.need_became_sad(need_id: Need.Id)); GameRoot is the only place connect() is called across systems"
    referenced_by:
      - docs/architecture/adr-0001-time-and-event-injection.md
    added: 2026-09-23
    revised: ""

  - contract: app_lifecycle
    status: active
    pattern: signal
    producer: AppLifecycle (src/core/app/app_lifecycle.gd)
    consumers:
      - GameRoot   # single handler; defines resume order
    adr: docs/architecture/adr-0001-time-and-event-injection.md
    signal_signature: "app_backgrounded(); app_resumed()  — from APPLICATION_PAUSED/RESUMED and FOCUS_OUT/IN, edge-detected. Resume order lives only in GameRoot._on_app_resumed(): offline_sim.reanchor_with_cap -> needs.on_resumed -> crossing_scheduler.rearm"
    referenced_by:
      - docs/architecture/adr-0001-time-and-event-injection.md
    added: 2026-09-23
    revised: ""


  - contract: pet_catalog_lookup
    status: active
    pattern: direct_call
    producer: pet-definition-data (PetCatalog, RefCounted)
    consumers:
      - save-persistence
      - hatching-onboarding
      - graduation-album
      - game-root   # passes NeedProfile/CareProfile into per-pet consumers such as NeedSystem
    adr: docs/architecture/adr-0002-pet-catalog-loading-and-immutability.md
    signature: "get_species(id: StringName) -> SpeciesDefinition; get_form(id: StringName) -> AdultFormDefinition; get_all_species() / get_hatchable_species() -> Array[SpeciesDefinition] (read-only). Unknown id -> null"
    referenced_by:
      - docs/architecture/adr-0002-pet-catalog-loading-and-immutability.md
    added: 2026-09-23
    revised: ""

