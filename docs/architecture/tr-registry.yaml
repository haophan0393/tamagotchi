# Technical Requirement ID Registry
#
# PURPOSE: Persistent, stable IDs for every GDD technical requirement.
# Prevents TR-ID renumbering across /architecture-review runs, which would
# break story references.
#
# RULES:
#   - IDs are PERMANENT. Never renumber, never delete (use status: deprecated).
#   - Add new entries only at the END of each system's list.
#   - When a GDD requirement is reworded (same intent): update `requirement`
#     text and add a `revised` date. The ID stays the same.
#   - When a requirement is removed from the GDD: set status: deprecated.
#   - When a requirement is split or replaced: set status: superseded-by with
#     the new TR-ID(s).
#
# WRITTEN BY: /architecture-review (appends new entries, never overwrites)
# READ BY:    /create-stories (embed IDs in stories)
#             /story-done (look up current requirement text at review time)
#             /story-readiness (validate TR-ID exists and is active)
#
# ID FORMAT: TR-[system-slug]-[NNN]
#   system-slug = short slug matching the GDD system name
#   NNN = three-digit zero-padded sequence per system, starting at 001
#
# STATUS VALUES: active | deprecated | superseded-by: TR-[system]-NNN

version: 1
last_updated: "2026-09-23"

requirements:

  # --- time-service ---
  - id: TR-time-service-001
    system: time-service
    gdd: design/gdd/time-service.md
    requirement: "Time Service exposes exactly four operations — get_now_utc(), get_elapsed_seconds(since_utc) clamped to max(0, now - since), get_local_calendar_date(utc), is_new_calendar_day(last, current); no other system reads the engine clock (Core Rule 1)"
    created: 2026-09-23
    revised: ""
    status: active
  - id: TR-time-service-002
    system: time-service
    gdd: design/gdd/time-service.md
    requirement: "TimeService is a plain RefCounted constructed with an injected TimeSource (get_unix_time, get_timezone_bias_minutes in minutes east of UTC); SystemTimeSource at src/core/time/system_time_source.gd is the only file calling engine clock APIs; FakeTimeSource is test-only (Core Rule 2; ADR-0001 §1)"
    created: 2026-09-23
    revised: ""
    status: active
  - id: TR-time-service-003
    system: time-service
    gdd: design/gdd/time-service.md
    requirement: "A TimeProvider Autoload holds exactly one production TimeService on SystemTimeSource; only the composition root GameRoot reads it; logic classes receive TimeService via _init() (Core Rule 2, AC #10; ADR-0001 §2)"
    created: 2026-09-23
    revised: ""
    status: active
  - id: TR-time-service-004
    system: time-service
    gdd: design/gdd/time-service.md
    requirement: "Time Service applies no gameplay policy — no offline clamp, no growth meaning of a new day (Core Rule 3)"
    created: 2026-09-23
    revised: ""
    status: active
  - id: TR-time-service-005
    system: time-service
    gdd: design/gdd/time-service.md
    requirement: "OS lifecycle is translated by one AppLifecycle node into edge-detected app_backgrounded / app_resumed signals (PAUSED/RESUMED and FOCUS_OUT/FOCUS_IN), handled by one ordered resume handler in GameRoot (Open Question on PAUSED/RESUMED; ADR-0001 §4)"
    created: 2026-09-23
    revised: ""
    status: active

