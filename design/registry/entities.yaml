# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: elapsed_seconds
    status: active
    source: design/gdd/time-service.md
    referenced_by:
      - design/gdd/time-service.md
    variables:
      - now_utc
      - since_utc
    output_range: [0, null]
    expression: "max(0, now_utc - since_utc)"
    notes: "Owned by Time Service's get_elapsed_seconds(). Never negative by
      construction (clamps to 0 if since_utc is in the future). No upper bound
      here — Offline Time Simulation applies its own MAX_OFFLINE cap on top of
      this value; that cap is a separate, downstream constant, not part of
      this formula. Consumed by Need System and Offline Time Simulation."
    added: 2026-09-18
    revised: ""

  - name: is_new_calendar_day
    status: active
    source: design/gdd/time-service.md
    referenced_by:
      - design/gdd/time-service.md
    variables:
      - now_utc
      - last_utc
    output_range: [false, true]
    expression: "local_date(now_utc) != local_date(last_utc)"
    notes: "Owned by Time Service's is_new_calendar_day(). Compares local
      calendar dates (device time zone), not a rolling 24-hour window — a
      midnight-crossing gap of minutes counts as a new day. Consumed by
      Life Stage & Growth (check-in-day growth arc) and Daily Notification."
    added: 2026-09-18
    revised: ""

  - name: care_action_share
    status: active
    source: design/gdd/pet-definition-data.md
    referenced_by:
      - design/gdd/pet-definition-data.md
    variables:
      - action_count
      - total_actions_in_window
    output_range: [0.0, 1.0]
    expression: "action_count / total_actions_in_window"
    notes: "Owned by Pet Definition Data's FormRuleTable schema (Core Rule 11)
      as the definition of what a ShareCondition.min_share compares against.
      Undefined at total_actions_in_window = 0 — Life Stage & Growth owns
      evaluating the table and resolving the empty-window case, not PDD.
      Consumed by Life Stage & Growth's child->adult form selection."
    added: 2026-09-21
    revised: ""

  - name: total_arc_days
    status: active
    source: design/gdd/pet-definition-data.md
    referenced_by:
      - design/gdd/pet-definition-data.md
    variables:
      - baby.days_to_advance
      - child.days_to_advance
      - adult_days_to_nearly_grown
    output_range: [0, null]
    expression: "baby.days_to_advance + child.days_to_advance + adult_days_to_nearly_grown"
    notes: "Rollup used to check a species' growth arc against game-concept.md's
      7-10 check-in day target band. Not load-time enforced (Core Rule 12
      doesn't check it) — a recommended-range smoke check only. egg and the
      nearly-grown->graduate step contribute 0 by design (see GDD Formulas
      section). bloop = 3 + 4 + 2 = 9."
    added: 2026-09-21
    revised: ""

